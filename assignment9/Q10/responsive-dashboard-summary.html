
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Dashboard Summary</title>
  <link rel="stylesheet" href="responsive-dashboard-summary.css" />
</head>
<body>
  <header class="container">
    <h1>Responsive Dashboard</h1>
  </header>

  <main class="container">
    <section class="dashboard" aria-label="Grid dashboard">
      <header class="dash-header card"><strong>Header</strong></header>
      <aside class="dash-sidebar card"><strong>Sidebar</strong></aside>
      <section class="dash-main card">
        <h2>Main Content</h2>
        <div class="cards">
          <article class="tile card"><h3>Filters</h3><p>Image/CSS filters overview.</p></article>
          <article class="tile card"><h3>Typography</h3><p>Fluid and clamped type.</p></article>
          <article class="tile card"><h3>Media Queries</h3><p>Adapt at breakpoints.</p></article>
          <article class="tile card"><h3>Cheat Sheet Links</h3><p>Quick references.</p></article>
        </div>
      </section>
    </section>
  </main>

  <footer class="container"><small>Resize to see sidebar reposition below 750px.</small></footer>
</body>
</html>
