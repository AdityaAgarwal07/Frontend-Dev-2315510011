<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form</title>
</head>
<body>
  <h2>Login Form</h2>
  <!-- CSRF token helps protect against cross-site request forgery attacks by ensuring form submissions come from the same site -->
  <form>
    <label>Username: <input type="text" name="username" required></label><br><br>
    <label>Password: <input type="password" name="password" required></label><br><br>
    <input type="hidden" name="csrf_token" value="dummy12345">
    <input type="submit" value="Login">
  </form>
</body>
</html>
