
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css" />
</head>
<body>
  <header class="container">
    <h1>Responsive Image Filter Gallery</h1>
    <p>Hover an image to remove the filter. Captions appear below each image.</p>
  </header>

  <main class="container">
    <section aria-label="Image Gallery" class="gallery">
      <!-- Each figure contains an image and a caption -->
      <figure class="tile blur">
        <img src="https://picsum.photos/id/1015/800/600" alt="Mountain lake landscape" />
        <figcaption>Blur</figcaption>
      </figure>

      <figure class="tile grayscale">
        <img src="https://picsum.photos/id/1025/800/600" alt="Dog portrait" />
        <figcaption>Grayscale</figcaption>
      </figure>

      <figure class="tile sepia">
        <img src="https://picsum.photos/id/1035/800/600" alt="Forest trail" />
        <figcaption>Sepia</figcaption>
      </figure>

      <figure class="tile brightness">
        <img src="https://picsum.photos/id/1043/800/600" alt="City skyline" />
        <figcaption>Brightness</figcaption>
      </figure>

      <figure class="tile contrast">
        <img src="https://picsum.photos/id/1050/800/600" alt="Desert dunes" />
        <figcaption>Contrast</figcaption>
      </figure>

      <figure class="tile hue">
        <img src="https://picsum.photos/id/1069/800/600" alt="Ocean waves" />
        <figcaption>Hue Rotate</figcaption>
      </figure>
    </section>
  </main>

  <footer class="container">
    <small>&copy; 2025 Responsive CSS Demo</small>
  </footer>
</body>
</html>
