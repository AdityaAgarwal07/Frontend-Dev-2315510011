
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borders & Padding Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Borders & Padding Demonstration</h1></header>
<main class="flex-row">
  <div class="box solid">Solid Border<br><span>.border-solid</span></div>
  <div class="box dashed">Dashed Border<br><span>.border-dashed</span></div>
  <div class="box double">Double Border<br><span>.border-double</span></div>
  <div class="box groove">Groove Border<br><span>.border-groove</span></div>
  <div class="box rounded">Rounded Corners<br><span>border-radius: 16px</span></div>
</main>
<footer><p>Hover a box to change border color.</p></footer>
</body>
</html>
