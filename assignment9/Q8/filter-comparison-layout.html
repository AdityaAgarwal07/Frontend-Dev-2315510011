
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css" />
</head>
<body>
  <header class="container"><h1>Before &amp; After (Filter)</h1></header>
  <main class="container">
    <section class="compare" aria-label="Filter comparison">
      <figure class="panel">
        <img src="https://picsum.photos/id/1047/900/600" alt="Before image" />
        <figcaption>Before</figcaption>
      </figure>
      <figure class="panel filtered">
        <img src="https://picsum.photos/id/1047/900/600" alt="After image with filter" />
        <figcaption>After (brightness)</figcaption>
      </figure>
    </section>
  </main>
  <footer class="container"><small>Hover the right image to fade the filter.</small></footer>
</body>
</html>
