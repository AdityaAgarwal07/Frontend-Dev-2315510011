<!DOCTYPE html>
<html lang="en">
<!-- Dropdown Selection Page for Aditya -->
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <header><h1>Location & Favorite Place Selection</h1></header>

  <main>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="india" selected>India</option>
      <option value="usa">USA</option>
    </select>
    <br>

    <label for="state">State:</label>
    <select id="state" name="state">
      <option value="maharashtra" selected>Maharashtra</option>
      <option value="kerala">Kerala</option>
    </select>
    <br>

    <label for="city">City:</label>
    <select id="city" name="city">
      <option value="mumbai" selected>Mumbai</option>
      <option value="pune">Pune</option>
    </select>
    <br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
      <option value="gateway" selected>Gateway of India</option>
      <option value="colaba">Colaba</option>
    </select>

    <p>Selected: Country - India; State - Maharashtra; City - Mumbai; Favorite - Gateway of India.</p>
  </main>

  <footer>
    <p>Prepared by Aditya</p>
  </footer>
</body>
</html>
