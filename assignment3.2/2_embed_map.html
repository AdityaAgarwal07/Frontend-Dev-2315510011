<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Map Embed</title>
</head>
<body>
  <h2>My City Map</h2>
  <!-- The 'loading="lazy"' attribute delays loading of the iframe until it appears in the viewport, improving performance. -->
  <iframe 
    src="https://www.google.com/maps?q=New+Delhi,+India&output=embed" 
    title="Google Map of New Delhi"
    width="80%" height="400" loading="lazy"></iframe>
</body>
</html>
