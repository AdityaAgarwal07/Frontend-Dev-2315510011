
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards-with-animation.css" />
</head>
<body>
  <header class="container">
    <h1>Profile Cards</h1>
  </header>
  <main class="container">
    <section class="profiles" aria-label="Profile cards">
      <article class="profile card fade-in">
        <img src="https://picsum.photos/id/1011/600/400" alt="River landscape" />
        <h3>Alex</h3><p>Nature enthusiast. Photographer.</p>
      </article>
      <article class="profile card fade-in">
        <img src="https://picsum.photos/id/1005/600/400" alt="Coastline cliffs" />
        <h3>Jamie</h3><p>Frontend developer. Traveler.</p>
      </article>
      <article class="profile card fade-in">
        <img src="https://picsum.photos/id/1000/600/400" alt="Snowy mountain" />
        <h3>Riya</h3><p>Designer. Runner. Coffee lover.</p>
      </article>
    </section>
  </main>
  <footer class="container"><small>Hover a card to lift and un-filter.</small></footer>
</body>
</html>
