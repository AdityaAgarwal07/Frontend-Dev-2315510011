
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Cards with Media Queries</title>
  <link rel="stylesheet" href="responsive-cards-with-media-queries.css" />
</head>
<body>
  <header class="container">
    <h1>Responsive Cards with Media Queries</h1>
  </header>

  <main class="container">
    <section class="cards" aria-label="Card grid">
      <article class="card tile"><h3>Card One</h3><p>Desktop: 4 columns, Tablet: 2, Mobile: 1.</p></article>
      <article class="card tile"><h3>Card Two</h3><p>Equal spacing and padding across breakpoints.</p></article>
      <article class="card tile"><h3>Card Three</h3><p>Hover to see background color change.</p></article>
      <article class="card tile"><h3>Card Four</h3><p>Flexbox layout with wrap behavior.</p></article>
    </section>
  </main>

  <footer class="container"><small>Built with Flexbox + media queries</small></footer>
</body>
</html>
