
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced Selectors</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Advanced CSS Selectors</h1></header>
<main>
  <form>
    <input type="text" placeholder="name (attribute selector)"><input type="email" placeholder="email"><br>
    <a href="https://example.com">Secure Link</a>
    <a href="http://other.com">Normal Link</a>
  </form>
  <ul class="items">
    <li>Item 1</li>
    <li class="special">Item 2 (nth-child)</li>
    <li>Item 3</li>
    <li>Item 4</li>
  </ul>
</main>
</body></html>
