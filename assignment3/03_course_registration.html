<!DOCTYPE html>
<html lang="en">
<!-- Course Registration Form structure for Aditya -->
<head>
  <meta charset="utf-8">
  <title>Course Registration</title>
</head>
<body>
  <header>
    <h1>Course Registration - Aditya</h1>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Personal Information</legend>
        <!-- Name and email inputs -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Aditya"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="aditya@example.com">
      </fieldset>

      <fieldset>
        <legend>Course Selection</legend>
        <label for="course">Select Course:</label>
        <select id="course" name="course">
          <option value="web" selected>Web Development</option>
          <option value="ml">Machine Learning</option>
          <option value="db">Database Systems</option>
        </select>
      </fieldset>
    </form>

    <h2>Available Course Schedules</h2>
    <table border="1">
      <thead>
        <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
      </thead>
      <tbody>
        <tr><td>Monday</td><td>10:00 - 12:00</td><td>Dr. Sharma</td></tr>
        <tr><td>Wednesday</td><td>14:00 - 16:00</td><td>Ms. Rao</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Contact: aditya@example.com</p>
  </footer>
</body>
</html>
